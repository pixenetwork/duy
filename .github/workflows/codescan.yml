# CodeScan — provenance-only for this repository.
# Authoritative validation is local/direct (see AGENTS.md / AI_WORKFLOW.md).
# Soft-fail so missing/misconfigured CODESCAN_* secrets do not block draft PR progress.
name: CodeScan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '37 4 * * 6'

permissions:
  contents: read

jobs:
  CodeScan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache files
        uses: actions/cache@v3
        with:
          path: |
            ~/.sonar
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Run Analysis
        id: codescan
        continue-on-error: true
        uses: codescan-io/codescan-scanner-action@5b2e8c5683ef6a5adc8fa3b7950bb07debccce12
        with:
          login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
          organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
          projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}
      - name: Upload SARIF file
        if: steps.codescan.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codescan.sarif
      - name: Record provenance outcome
        run: |
          echo "CodeScan step outcome: ${{ steps.codescan.outcome }}"
          echo "GitHub Actions results are provenance only for this repository."
